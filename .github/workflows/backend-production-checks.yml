name: Backend Production Checks

on:
  schedule:
    - cron: '0 14 * * *'
  push:
    branches:
      - main
    paths:
      - 'v3/**'
      - '.github/workflows/backend-production-checks.yml'
      - 'DEPLOY-CHECKLIST.md'
      - 'ADMIN-OPERATIONS-RUNBOOK.md'
      - 'PRODUCTION-READINESS.md'
      - 'TWO-WEEK-PRODUCTION-99-PLAN.md'
      - 'MONITORING-RUNBOOK.md'
      - 'SECURITY-PRODUCTION-CHECKLIST.md'
  pull_request:
    branches:
      - main
    paths:
      - 'v3/**'
      - '.github/workflows/backend-production-checks.yml'
      - 'DEPLOY-CHECKLIST.md'
      - 'ADMIN-OPERATIONS-RUNBOOK.md'
      - 'PRODUCTION-READINESS.md'
      - 'TWO-WEEK-PRODUCTION-99-PLAN.md'
      - 'MONITORING-RUNBOOK.md'
      - 'SECURITY-PRODUCTION-CHECKLIST.md'
  workflow_dispatch:

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v3/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix v3

      - name: Syntax check
        run: node --check v3/pure-server.js

      - name: PostgreSQL storage smoke
        run: npm --prefix v3 run test:pg-storage

      - name: PostgreSQL workflow smoke
        run: npm --prefix v3 run test:pg-workflow

      - name: Production smoke script validation
        run: npm --prefix v3 run test:production-smoke-script

      - name: Admin audit export script validation
        run: npm --prefix v3 run test:admin-audit-export-script

      - name: Operations status report script validation
        run: npm --prefix v3 run test:ops-status-report-script

      - name: Production gates summary script validation
        run: npm --prefix v3 run test:production-gates-summary-script

      - name: CI monitoring workflow validation
        run: npm --prefix v3 run test:ci-monitoring-workflow

      - name: Admin bootstrap env check script validation
        run: npm --prefix v3 run test:admin-bootstrap-check-script

      - name: Migration readiness script validation
        run: npm --prefix v3 run test:migration-readiness-script

      - name: Restore drill script validation
        run: npm --prefix v3 run test:restore-drill-script

      - name: Migration readiness check
        run: npm --prefix v3 run db:migrations:check

      - name: Security CORS smoke script validation
        run: npm --prefix v3 run test:security-cors-smoke-script

      - name: Security env check script validation
        run: npm --prefix v3 run test:security-env-check-script

      - name: Production public smoke
        run: npm --prefix v3 run smoke:production

      - name: Security CORS public smoke
        run: npm --prefix v3 run security:cors:smoke

      - name: Production status report
        run: npm --prefix v3 run ops:status

      - name: Production gates summary
        run: npm --prefix v3 run ops:gates

      - name: Upload production evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-status-evidence
          path: |
            evidence/production-status-*.json
            evidence/production-gates-*.md
          if-no-files-found: error
          retention-days: 14
